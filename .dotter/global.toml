[ghostty]
files = { "ghostty/config.ghostty" = "~/Library/Application Support/com.mitchellh.ghostty/config.ghostty" }

[zsh]
files = { "zsh/.zshrc" = "~/.zshrc", "zsh/.zprofile" = "~/.zprofile" }

[fish]
files = { "fish/config.fish" = "~/.config/fish/config.fish", "fish/functions" = "~/.config/fish/functions", "fish/fish_plugins" = "~/.config/fish/fish_plugins" }

[vim]
files = { "vim/.vimrc" = "~/.vimrc" }

[bash]
files = { "bash/.bashrc" = "~/.bashrc", "bash/.bash_profile" = "~/.bash_profile" }

[manico]
files = { "manico/sync.sh" = "manico/sync.sh", "manico/settings.txt" = "manico/settings.txt" }

[tmux]
files = { "tmux/.tmux.conf" = "~/.tmux.conf" }

[mise]
files = { "mise/config.toml" = "~/.config/mise/config.toml" }