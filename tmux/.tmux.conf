# =============================================================================
# General
# =============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -ga update-environment " SSH_CLIENT SSH_TTY"

# =============================================================================
# Plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'

# tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# =============================================================================
# Catppuccin — must configure before running the plugin
# =============================================================================
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_date_time_text "%H:%M  %m/%d"
set -g @catppuccin_status_background "none"

# Run catppuccin first
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar — must be set AFTER catppuccin is sourced
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right " "
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Run cpu plugin AFTER status-right is set
run ~/.tmux/plugins/tmux-cpu/cpu.tmux

# =============================================================================
# Initialize tpm (keep at bottom)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
