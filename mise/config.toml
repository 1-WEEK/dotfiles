# Global mise tool versions.
# Philosophy: everything that can be version-locked by mise goes here.
# See CLAUDE.md → "Environment management philosophy" for the full rules.

[settings]

[settings.ruby]
compile = false

[settings.node]
default_packages_file = "~/.default-npm-packages"

[settings.npm]
bun = true

[tools]
aube = "latest"
bun = "latest"
"cargo:abtop" = "latest"
"gem:colorls" = "latest"
node = "lts"
"npm:clawhub" = "latest"
"npm:@jackwener/opencli" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@openai/codex" = "latest"
ruby = "latest"
rust = "latest"
"npm:taze" = "latest"
"npm:defuddle" = "latest"
cargo-binstall = "latest"
uv = "latest"
python = "3.13"
pipx = "latest"
"pipx:nmem-cli" = "latest"
"npm:skills" = "latest"
"npm:@moonshot-ai/kimi-code" = "latest"
